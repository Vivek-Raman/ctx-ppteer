<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202124" />
    <title>Agent status</title>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <section id="viewer">
        <header class="toolbar">
          <div class="source-controls">
            <button id="choose-source" type="button" title="Choose a Markdown file">Open file</button>
            <label class="path-label" for="source-path">Source</label>
            <input id="source-path" type="text" spellcheck="false" placeholder="No Markdown file selected" />
            <button id="apply-source" type="button">Apply</button>
          </div>
          <div class="view-controls" role="group" aria-label="Viewer controls">
            <button id="refresh-source" type="button" title="Read the source again">Refresh</button>
            <button id="pin-source" type="button" aria-pressed="true" title="Keep this window above other windows">Pinned</button>
            <button id="settings-button" type="button">Settings</button>
            <label class="scale-control" title="Text scale">
              <span>Text</span>
              <input id="text-scale" type="range" min="0.85" max="1.35" step="0.05" value="1" />
            </label>
          </div>
        </header>
        <div class="statusbar">
          <span id="health-indicator" class="health-dot waiting" aria-hidden="true"></span>
          <span id="health-text">Waiting for a Markdown file</span>
          <time id="modified-time" class="modified-time"></time>
        </div>
        <section id="document" class="document" tabindex="0" aria-label="Markdown document">
          <div class="empty-state">
            <h1>Agent status</h1>
            <p>Choose an aggregate Markdown file to begin watching it.</p>
          </div>
        </section>
      </section>
      <section id="settings-page" class="settings-page" hidden aria-labelledby="settings-title">
        <header class="settings-header">
          <button id="back-to-viewer" type="button">Back</button>
          <h1 id="settings-title">Settings</h1>
        </header>
        <div class="settings-content">
          <label class="setting-row" for="theme-select">
            <span>
              <strong>Theme</strong>
              <small>Choose how the app looks.</small>
            </span>
            <select id="theme-select">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
